name: nvprime CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup tmpfs build
        run: |
          rm -rf /tmp/nvprime
          cp -r src /tmp/nvprime

      - name: Zig Version
        run: zig version

      - name: Format Check
        working-directory: /tmp/nvprime
        run: zig fmt --check src/ build.zig

      - name: Build (Release)
        working-directory: /tmp/nvprime
        run: zig build -Doptimize=ReleaseFast -Dnvml=false

      - name: Run Tests
        working-directory: /tmp/nvprime
        run: zig build test -Dnvml=false

      - name: Verify Binary
        working-directory: /tmp/nvprime
        run: |
          file zig-out/bin/nvprime
          ./zig-out/bin/nvprime version || true
