name: nvprime CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ZIG_LOCAL_CACHE_DIR: /tmp/zig-cache
  ZIG_GLOBAL_CACHE_DIR: /tmp/zig-global

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zig Version
        run: zig version

      - name: Fetch Dependencies
        run: zig build --fetch

      - name: Format Check
        run: zig fmt --check src/ build.zig

      - name: Build (Release)
        run: zig build -Doptimize=ReleaseFast -Dnvml=false

      - name: Run Tests
        run: zig build test -Dnvml=false

      - name: Verify Binary
        run: |
          file zig-out/bin/nvprime
          ./zig-out/bin/nvprime version || true
