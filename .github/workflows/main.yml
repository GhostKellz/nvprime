name: nvprime CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Build Directory
        run: |
          rm -rf /tmp/nvprime-build
          cp -r . /tmp/nvprime-build
          cd /tmp/nvprime-build

      - name: Zig Version
        run: zig version

      - name: Format Check
        run: zig fmt --check src/ build.zig

      - name: Build (Release)
        working-directory: /tmp/nvprime-build
        run: zig build -Doptimize=ReleaseFast -Dnvml=false -j1

      - name: Run Tests
        working-directory: /tmp/nvprime-build
        run: zig build test -Dnvml=false -j1

      - name: Verify Binary
        working-directory: /tmp/nvprime-build
        run: |
          file zig-out/bin/nvprime
          ./zig-out/bin/nvprime version || true

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/nvprime-build
