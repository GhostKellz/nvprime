name: nvprime CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Cache Dirs
        run: |
          mkdir -p /tmp/zig-cache /tmp/zig-global
          rm -rf .zig-cache zig-out

      - name: Zig Version
        run: zig version

      - name: Fetch Dependencies
        run: zig build --fetch --cache-dir /tmp/zig-cache --global-cache-dir /tmp/zig-global

      - name: Format Check
        run: zig fmt --check src/ build.zig

      - name: Build (Release)
        run: zig build -Doptimize=ReleaseFast -Dnvml=false --cache-dir /tmp/zig-cache --global-cache-dir /tmp/zig-global

      - name: Run Tests
        run: zig build test -Dnvml=false --cache-dir /tmp/zig-cache --global-cache-dir /tmp/zig-global

      - name: Verify Binary
        run: |
          file zig-out/bin/nvprime
          ./zig-out/bin/nvprime version || true
