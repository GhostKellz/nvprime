# NVPrime Configuration
# Maintainer: Christopher Kelley <ckelley@ghostkellz.sh>
#
# This file configures the NVPrime NVIDIA subsystem layer.
# Changes take effect after restarting the nvprime service.

[general]
# Enable D-Bus interface
dbus_enabled = true

# Log level: error, warn, info, debug
log_level = info

# Primary GPU index (0 = first NVIDIA GPU)
primary_gpu = 0

[power]
# Power management mode: adaptive, maximum_performance, prefer_efficiency
power_mode = adaptive

# Enable power limit management
power_limit_enabled = true

# Default power limit percentage (0 = use GPU default)
default_power_limit_pct = 100

# Thermal throttle temperature (Celsius, 0 = GPU default)
thermal_target = 0

[display]
# Enable VRR (G-Sync/FreeSync) by default
vrr_enabled = true

# Enable HDR passthrough
hdr_enabled = true

# Frame limiter (0 = disabled)
fps_limit = 0

[dlss]
# Default DLSS quality mode: ultra_performance, performance, balanced, quality, dlaa
default_quality = balanced

# Enable Frame Generation on supported GPUs (RTX 40+)
frame_generation = true

# Enable Ray Reconstruction
ray_reconstruction = true

[reflex]
# Enable Reflex low-latency mode by default
enabled = true

# Enable Reflex Boost (may increase power consumption)
boost = false

[streaming]
# Default streaming quality: ultra_low_latency, low_latency, balanced, high_quality
quality = balanced

# Default video codec: h264, hevc, av1
codec = hevc

# Enable HDR streaming (requires HDR display on client)
hdr = false

[overlay]
# Show performance overlay by default
enabled = false

# Overlay position: top_left, top_right, bottom_left, bottom_right
position = top_left

# Show FPS counter
show_fps = true

# Show GPU temperature
show_temperature = true

# Show GPU utilization
show_utilization = true

# Show VRAM usage
show_vram = true

# Show frame time graph
show_frametime = true
